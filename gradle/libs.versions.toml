[versions]
adk = "0.8.0"
agp = "9.3.0"
activityCompose = "1.13.0"
appcompat = "1.7.1"
composeBom = "2026.06.01"
coroutines = "1.11.0"
firebaseBom = "34.17.0"
googleServices = "4.5.0"
junit = "4.13.2"
kotlin = "2.2.10"
lifecycle = "2.10.0"
serialization = "1.11.0"
media3 = "1.11.0"
sherpaOnnx = "1.13.5"
mlkitTranslate = "17.0.3"
assKt = "0.5.1"
mockito = "5.23.0"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
adk-core = { module = "com.google.adk:google-adk-kotlin-core", version.ref = "adk" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-ai = { module = "com.google.firebase:firebase-ai" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
sherpa-onnx = { module = "com.github.k2-fsa.sherpa-onnx:sherpa-onnx", version.ref = "sherpaOnnx" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkitTranslate" }
ass-kt = { module = "io.github.peerless2012:ass-kt", version.ref = "assKt" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
